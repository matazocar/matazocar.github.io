<style>
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#16202B; --muted:#56636F; --line:#D5DDE4; --soft:#F5F8FA;
  --red:#C8323F; --blue:#1F6FC0; --green:#1E8A5A; --purple:#6C45BE; --orange:#C9661A; --pink:#B42A68; --teal:#0E7F86;
  --warn-bg:#FFF4E0; --warn-ink:#7A4A00; --hi:#FFF2B3;
  --font:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151C; --surface:#18212B; --ink:#E6ECF2; --muted:#9AA8B5; --line:#2A3542; --soft:#1D2733;
    --red:#E25563; --blue:#4D97E6; --green:#3DB37E; --purple:#9877E3; --orange:#E68A3E; --pink:#DC5592; --teal:#35B3BA;
    --warn-bg:#3A2C12; --warn-ink:#F3C77A; --hi:#3B3615;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --ink:#E6ECF2; --muted:#9AA8B5; --line:#2A3542; --soft:#1D2733;
  --red:#E25563; --blue:#4D97E6; --green:#3DB37E; --purple:#9877E3; --orange:#E68A3E; --pink:#DC5592; --teal:#35B3BA;
  --warn-bg:#3A2C12; --warn-ink:#F3C77A; --hi:#3B3615;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}
/* patient strip */
.patient{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 10px -6px rgba(0,0,0,.25)}
.patient .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:10px 16px;align-items:end;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;margin-right:auto;align-self:center;text-decoration:none;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:2px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select{width:76px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--soft);font-weight:600}
.field select{width:auto}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.wnote{font-size:12px;color:var(--warn-ink);background:var(--warn-bg);padding:2px 8px;border-radius:6px;align-self:center}
@media (max-width:560px){.patient .in{padding:8px 12px;gap:6px 8px}.brand{flex-basis:100%;font-size:16px}.field input{width:62px;padding:6px}.wnote{flex-basis:100%;order:9}}
.langbtn{font-weight:800;font-size:14px;padding:0 10px}
.iconbtn{border:1px solid var(--line);background:var(--soft);border-radius:8px;min-width:38px;min-height:38px;cursor:pointer}
/* home */
.hero{padding:26px 0 8px}
.hero h1{font-size:30px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em;line-height:1.15}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:132px;padding:16px;border:0;border-radius:14px;color:#fff;text-align:left;cursor:pointer;text-decoration:none;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14)}
.tile b{font-size:19px;font-weight:800;line-height:1.2;position:relative}
.tile span{font-size:14px;opacity:.92;line-height:1.35}
.tile:hover{filter:brightness(1.06)}
.tile:active{transform:scale(.99)}
.emerg{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.emerg strong{font-size:26px;color:var(--red);font-weight:800}
/* tool pages */
.toolhead{margin:0 -16px;padding:18px 16px 16px;color:#fff;background:var(--c)}
.toolhead .back{color:#fff;text-decoration:none;font-weight:600;font-size:15px;opacity:.9}
.toolhead h1{margin:6px 0 2px;font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.toolhead p{margin:0;opacity:.9;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.card h2{font-size:17px;font-weight:800;margin:0 0 10px}
.card h3{font-size:15px;font-weight:800;margin:14px 0 6px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:10px 12px;border-left:4px solid var(--c)}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-size:22px;font-weight:800;line-height:1.25}
.stat .u{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700}
tr.hi td{background:var(--hi);font-weight:700}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:14px}
.src{font-size:13px;color:var(--muted);margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.seg button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.drug{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line)}
.drug:first-of-type{border-top:0}
.drug .n{font-weight:800}
.drug .how{font-size:14px;color:var(--muted)}
.drug .dose{text-align:right;font-weight:800;font-size:18px;white-space:nowrap}
.drug .vol{text-align:right;font-size:14px;color:var(--muted)}
.cap{font-size:12px;font-weight:700;color:var(--warn-ink);background:var(--warn-bg);border-radius:5px;padding:1px 6px;margin-left:4px}
@media (max-width:520px){.drug{grid-template-columns:1fr}.drug .dose,.drug .vol{text-align:left}}
ul.clean{margin:4px 0 0;padding-left:20px}
ul.clean li{margin:3px 0}
.domains{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.domain{background:var(--soft);border-radius:10px;padding:10px 12px}
.domain h3{margin:0 0 4px;color:var(--c)}
.vax{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.vax:first-child{border-top:0}
.vax .age{font-weight:800;color:var(--c)}
@media (max-width:520px){.vax{grid-template-columns:1fr;gap:2px}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:14px}
.inl input,.inl select{width:96px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--soft);font-weight:600}
.inl select{width:auto}
.inl label{display:block;font-size:12px;color:var(--muted);font-weight:600}
footer{font-size:13px;color:var(--muted);margin-top:28px}
</style>
</head>
<body>
<div class="patient" role="region" id="patientRegion">
  <div class="in">
    <a class="brand" href="#">Prontuario pediatrico</a>
    <div class="field"><label for="pY" data-t="ageY"></label><input id="pY" type="number" min="0" max="18" inputmode="numeric" placeholder="–"></div>
    <div class="field"><label for="pM" data-t="ageM"></label><input id="pM" type="number" min="0" max="11" inputmode="numeric" placeholder="–"></div>
    <div class="field"><label for="pW" data-t="wt"></label><input id="pW" type="number" min="0.5" max="150" step="0.1" inputmode="decimal" placeholder="–"></div>
    <span class="wnote" id="wNote" hidden></span>
    <button class="iconbtn langbtn" id="langBtn"></button>
    <button class="iconbtn" id="themeBtn">◐</button>
  </div>
</div>
<div class="wrap"><main id="app"></main>
<footer data-t="footer"></footer>
</div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
let lang = "it";
try { const l = localStorage.getItem("prontuario.lang"); if (l === "en" || l === "it") lang = l; } catch(e){}
const L = (it, en) => lang === "it" ? it : en;
const P = { y:null, m:null, w:null };
const fmt = (n, d=1) => { if (n == null || !isFinite(n)) return "–"; const r = Math.round(n * 10**d) / 10**d; return r.toLocaleString(lang === "it" ? "it-IT" : "en-GB", {maximumFractionDigits:d}); };

/* ---------- static labels ---------- */
const STATIC = {
  ageY: ["Età, anni","Age, years"], ageM: ["+ mesi","+ months"], wt: ["Peso, kg","Weight, kg"],
  footer: ["Solo per studio e consultazione rapida. Dosi e valori vanno verificati con i protocolli del tuo ospedale, il Riassunto delle Caratteristiche del Prodotto (AIFA) e le linee guida aggiornate prima dell'uso su un paziente.",
           "For study and quick reference only. Doses and values must be checked against your hospital protocols, the product SmPC (AIFA) and current guidelines before use on a patient."]
};
function applyStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => { const s = STATIC[e.dataset.t]; e.textContent = L(s[0], s[1]); });
  const lb = $("#langBtn");
  lb.textContent = lang === "it" ? "EN" : "IT";
  lb.setAttribute("aria-label", L("Switch to English", "Passa all'italiano"));
  lb.title = lb.getAttribute("aria-label");
  $("#themeBtn").setAttribute("aria-label", L("Tema chiaro o scuro", "Light or dark theme"));
  $("#patientRegion").setAttribute("aria-label", L("Dati del paziente", "Patient details"));
  updateWNote();
}

/* ---------- patient context ---------- */
function ageMonths(){ if (P.y == null && P.m == null) return null; return (P.y || 0) * 12 + (P.m || 0); }
function estWeight(mo){
  if (mo == null) return null;
  if (mo < 12) return 0.5 * mo + 4;
  const y = Math.floor(mo / 12);
  if (y <= 5) return 2 * y + 8;
  if (y <= 12) return 3 * y + 7;
  return null;
}
function weight(){
  if (P.w) return { w:P.w, est:false };
  const e = estWeight(ageMonths());
  return e ? { w:e, est:true } : { w:null, est:false };
}
function updateWNote(){
  const n = $("#wNote"), w = weight();
  if (w.est){ n.hidden = false; n.textContent = L(`Stimato ${fmt(w.w)} kg dall'età`, `Estimated ${fmt(w.w)} kg from age`); }
  else n.hidden = true;
}
for (const [id,key] of [["#pY","y"],["#pM","m"],["#pW","w"]]){
  $(id).addEventListener("input", e => { const v = parseFloat(e.target.value); P[key] = isFinite(v) && v >= 0 ? v : null; updateWNote(); if (current && current.update) current.update(); });
}

/* ---------- tools ---------- */
const TOOLS = [
  { id:"vitals", t:["Parametri vitali per età","Vital signs by age"], b:["Valori normali, ipotensione, SpO₂","Normal ranges, hypotension, SpO₂"], c:"var(--red)" },
  { id:"fluids", t:["Liquidi","Fluids"], b:["Mantenimento, disidratazione, boli","Maintenance, dehydration, boluses"], c:"var(--blue)" },
  { id:"growth", t:["Accrescimento","Growth and body"], b:["BMI, superficie corporea, target, velocità","BMI, BSA, target height, velocity"], c:"var(--green)" },
  { id:"milestones", t:["Tappe dello sviluppo","Milestones"], b:["Sviluppo per età e segnali d'allarme","Development by age and red flags"], c:"var(--purple)" },
  { id:"vaccines", t:["Vaccinazioni","Vaccines"], b:["Calendario italiano e obblighi","Italian schedule and mandatory list"], c:"var(--orange)" },
  { id:"doses", t:["Dosi in emergenza","Emergency doses"], b:["Dosi per peso e vie aeree","Weight-based doses and airway"], c:"var(--pink)" },
  { id:"antibiotics", t:["Antibiotici","Antibiotics"], b:["Infezioni comuni: scelta, dosi, durata","Common infections: choice, doses, duration"], c:"var(--teal)" }
];
const tt = t => L(t.t[0], t.t[1]);
let current = null;
const app = $("#app");

function head(t, sub){
  return `<div class="toolhead" style="--c:${t.c}"><a class="back" href="#">‹ ${L("Tutti gli strumenti","All tools")}</a><h1>${tt(t)}</h1><p>${sub}</p></div>`;
}
const needWeight = () => `<div class="card">${L("Inserisci il peso (o l'età per stimarlo) in alto.","Enter the weight (or the age to estimate it) at the top.")}</div>`;

/* ===== HOME ===== */
function home(){
  app.innerHTML = `
  <section class="hero"><h1>${L("Consultazione rapida in reparto","Ward quick reference")}</h1>
  <p>${L("Inserisci una sola volta età e peso del bambino in alto: tutti gli strumenti li usano. Scegli uno strumento qui sotto.","Enter the child's age and weight at the top once; every tool uses them. Pick a tool below.")}</p></section>
  <nav class="tiles" aria-label="${L("Strumenti","Tools")}">
    ${TOOLS.map(t => `<a class="tile" href="#${t.id}" style="background:${t.c}"><b>${tt(t)}</b><span>${L(t.b[0], t.b[1])}</span></a>`).join("")}
  </nav>
  <div class="emerg"><strong>112</strong><div>${L(
    "Numero Unico di Emergenza (NUE 112, o 118 dove ancora attivo). Per le intossicazioni chiama un Centro Antiveleni (CAV): l'elenco dei CAV è sul sito del Ministero della Salute.",
    "Numero Unico di Emergenza (NUE 112, or 118 where still active). For poisonings, call a Centro Antiveleni (CAV); the list of CAVs is on the Ministero della Salute website.")}</div></div>`;
  return {};
}

/* ===== VITALS ===== */
const BANDS = [
  { lab:["Neonato (0–28 giorni)","Neonate (0–28 days)"], to:1, hrA:"100–205", hrS:"90–160", rr:"30–53", sbp:"67–84" },
  { lab:["Lattante (1–12 mesi)","Infant (1–12 months)"], to:12, hrA:"100–180", hrS:"90–160", rr:"30–53", sbp:"72–104" },
  { lab:["Bambino piccolo (1–2 anni)","Toddler (1–2 years)"], to:36, hrA:"98–140", hrS:"80–120", rr:"22–37", sbp:"86–106" },
  { lab:["Età prescolare (3–5 anni)","Preschool (3–5 years)"], to:72, hrA:"80–120", hrS:"65–100", rr:"20–28", sbp:"89–112" },
  { lab:["Età scolare (6–9 anni)","School age (6–9 years)"], to:120, hrA:"75–118", hrS:"58–90", rr:"18–25", sbp:"97–115" },
  { lab:["Preadolescente (10–12 anni)","Preadolescent (10–12 years)"], to:156, hrA:"75–118", hrS:"58–90", rr:"18–25", sbp:"102–120" },
  { lab:["Adolescente (13–18 anni)","Adolescent (13–18 years)"], to:999, hrA:"60–100", hrS:"50–90", rr:"12–20", sbp:"110–131" }
];
function hypotension(mo){
  if (mo == null) return null;
  if (mo < 1) return "< 60";
  if (mo < 12) return "< 70";
  const y = mo / 12;
  if (y <= 10) return "< " + Math.round(70 + 2 * Math.floor(y));
  return "< 90";
}
function vitals(t){
  app.innerHTML = head(t, L("Valori normali di frequenza cardiaca, respiratoria e pressione","Normal ranges for heart rate, breathing and blood pressure")) + `<div id="out"></div>`;
  const update = () => {
    const mo = ageMonths();
    const bi = mo == null ? -1 : BANDS.findIndex(b => mo < b.to);
    const b = BANDS[bi];
    $("#out").innerHTML = `
    <div class="card" style="--c:${t.c}">
      <h2>${b ? L(b.lab[0], b.lab[1]) : L("Inserisci l'età in alto per evidenziare la riga giusta","Set the age at the top to highlight the right row")}</h2>
      ${b ? `<div class="big">
        <div class="stat"><div class="k">${L("FC da sveglio","Heart rate, awake")}</div><div class="v">${b.hrA}</div><div class="u">${L("battiti/min (nel sonno","beats/min (asleep")} ${b.hrS})</div></div>
        <div class="stat"><div class="k">${L("Frequenza respiratoria","Respiratory rate")}</div><div class="v">${b.rr}</div><div class="u">${L("atti/min","breaths/min")}</div></div>
        <div class="stat"><div class="k">${L("PA sistolica","Systolic BP")}</div><div class="v">${b.sbp}</div><div class="u">mmHg</div></div>
        <div class="stat"><div class="k">${L("Ipotensione se PAS","Hypotension if SBP")}</div><div class="v">${hypotension(mo)}</div><div class="u">mmHg</div></div>
      </div>` : ""}
      <div class="tbl"><table>
        <thead><tr><th>${L("Età","Age")}</th><th>${L("FC sveglio","HR awake")}</th><th>${L("FC nel sonno","HR asleep")}</th><th>${L("FR","RR")}</th><th>${L("PAS","SBP")}</th></tr></thead>
        <tbody>${BANDS.map((x,i) => `<tr class="${i===bi?"hi":""}"><td>${L(x.lab[0], x.lab[1])}</td><td>${x.hrA}</td><td>${x.hrS}</td><td>${x.rr}</td><td>${x.sbp}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>
    <div class="card"><h2>${L("Altri obiettivi","Other targets")}</h2>
      <ul class="clean">${L(`
        <li><b>SpO₂:</b> obiettivo 94–98% nel bambino in fase acuta (ERC 2021).</li>
        <li><b>Tempo di refill capillare:</b> normale fino a 2 secondi; tempi più lunghi suggeriscono scarsa perfusione.</li>
        <li><b>Soglie di ipotensione:</b> sotto 60 mmHg nel neonato a termine, sotto 70 nel lattante, sotto 70 + (2 × età in anni) da 1 a 10 anni, sotto 90 oltre i 10 anni.</li>
        <li><b>Febbre:</b> temperatura corporea di 38 °C o più (linea guida SIP sulla febbre). Sotto i 3 mesi qualsiasi febbre richiede una valutazione urgente.</li>`,`
        <li><b>SpO₂:</b> aim for 94–98% in the acutely ill child (ERC 2021).</li>
        <li><b>Capillary refill:</b> normally 2 seconds or less; longer suggests poor perfusion.</li>
        <li><b>Hypotension thresholds:</b> under 60 mmHg in term neonates, under 70 in infants, under 70 + (2 × age in years) from 1 to 10 years, under 90 over 10 years.</li>
        <li><b>Fever:</b> body temperature of 38 °C or more (Italian SIP fever guideline). Under 3 months, any fever needs urgent assessment.</li>`)}
      </ul>
    </div>
    <p class="src">${L(
      "Valori dalle tabelle di riferimento PALS (AHA 2020), coerenti con l'approccio EPALS insegnato nei corsi IRC (Italian Resuscitation Council). I range variano tra le fonti: per l'escalation usa la scheda PEWS del tuo reparto.",
      "Ranges from PALS reference tables (AHA 2020), consistent with the EPALS approach taught in Italian Resuscitation Council (IRC) courses. Ranges vary between sources; use your unit's PEWS chart for escalation.")}</p>`;
  };
  update(); return { update };
}

/* ===== FLUIDS ===== */
function maint(w){
  const day = w <= 10 ? 100*w : w <= 20 ? 1000 + 50*(w-10) : 1500 + 20*(w-20);
  const hr = w <= 10 ? 4*w : w <= 20 ? 40 + 2*(w-10) : 60 + (w-20);
  return { day: Math.min(day, 2400), hr: Math.min(hr, 100), capped: day > 2400 };
}
let dehyd = "mild", defPct = 5;
function fluids(t){
  app.innerHTML = head(t, L("Mantenimento secondo Holliday–Segar, reidratazione nella gastroenterite, boli nello shock","Holliday–Segar maintenance, gastroenteritis rehydration, shock boluses")) + `<div id="out"></div>`;
  const update = () => {
    const W = weight(), w = W.w, mo = ageMonths();
    if (!w){ $("#out").innerHTML = needWeight(); return; }
    const m = maint(w);
    const neo = mo != null && mo < 1;
    $("#out").innerHTML = `
    ${W.est ? `<div class="warn">${L(`Uso un peso stimato di ${fmt(w)} kg. Quando possibile pesa il bambino.`,`Using an estimated weight of ${fmt(w)} kg. Weigh the child whenever possible.`)}</div>` : ""}
    ${neo ? `<div class="warn">${L("Queste regole non valgono per il neonato nel primo mese: usa i protocolli neonatali.","These rules are not for neonates in the first month; use neonatal fluid protocols.")}</div>` : ""}
    <div class="card" style="--c:${t.c}"><h2>${L("Mantenimento (Holliday–Segar)","Maintenance (Holliday–Segar)")}</h2>
      <div class="big">
        <div class="stat"><div class="k">${L("All'ora","Per hour")}</div><div class="v">${fmt(m.hr)} mL/h</div><div class="u">${L("regola 4-2-1","4-2-1 rule")}</div></div>
        <div class="stat"><div class="k">${L("Al giorno","Per day")}</div><div class="v">${fmt(m.day,0)} mL</div><div class="u">${L("regola 100-50-20","100-50-20 rule")}${m.capped ? L(", limitato al volume dell'adulto",", capped at adult volume") : ""}</div></div>
      </div>
      <p class="note">${L(
        "Usa soluzioni isotoniche (per esempio NaCl 0,9% con glucosio 5%) per evitare l'iponatriemia. Molti bambini in fase acuta richiedono un volume ridotto (per esempio due terzi del mantenimento) per la secrezione di ADH: controlla la sodiemia e segui il protocollo del reparto.",
        "Use isotonic fluids (for example NaCl 0.9% with glucose 5%) to avoid hyponatraemia. Many acutely ill children need a restricted volume (for example two thirds of maintenance) because of ADH secretion; check sodium and follow your unit protocol.")}</p>
    </div>
    <div class="card" style="--c:${t.c}"><h2>${L("Gastroenterite: disidratazione","Gastroenteritis: dehydration")}</h2>
      <div class="seg" role="group" aria-label="${L("Grado di disidratazione","Degree of dehydration")}">
        ${[["none",L("Assente o minima (< 3%)","No or minimal (< 3%)")],["mild",L("Lieve-moderata (3–9%)","Mild to moderate (3–9%)")],["severe",L("Grave (> 9%)","Severe (> 9%)")]].map(([k,l]) => `<button type="button" data-d="${k}" aria-pressed="${dehyd===k}">${l}</button>`).join("")}
      </div>
      <div id="dh"></div>
      <h3>${L("Perdite in corso (reintegrare con SRO)","Ongoing losses (replace with ORS)")}</h3>
      <div class="big">
        <div class="stat"><div class="k">${L("Per ogni scarica diarroica","Each watery stool")}</div><div class="v">${fmt(10*w,0)} mL</div><div class="u">10 mL/kg</div></div>
        <div class="stat"><div class="k">${L("Per ogni vomito","Each vomit")}</div><div class="v">${fmt(2*w,0)} mL</div><div class="u">2 mL/kg</div></div>
      </div>
    </div>
    <div class="card" style="--c:${t.c}"><h2>${L("Correzione del deficit (EV)","Deficit replacement (IV)")}</h2>
      <div class="row inl"><div><label for="defPct">${L("Disidratazione, %","Dehydration, %")}</label><input id="defPct" type="number" min="1" max="15" value="${defPct}"></div></div>
      <div class="big" style="margin-top:10px">
        <div class="stat"><div class="k">Deficit</div><div class="v" id="defV">${fmt(defPct*w*10,0)} mL</div><div class="u">% × kg × 10</div></div>
        <div class="stat"><div class="k">${L("Deficit + mantenimento in 24 h","Deficit + maintenance over 24 h")}</div><div class="v" id="defH">${fmt((defPct*w*10 + m.day)/24,0)} mL/h</div><div class="u">${L("sottrai i boli già somministrati","subtract boluses already given")}</div></div>
      </div>
      <p class="note">${L("Non per la chetoacidosi diabetica, che ha un protocollo dedicato (ISPAD / SIEDP), né per bambini con cardiopatia o nefropatia.","Not for diabetic ketoacidosis, which has its own protocol (ISPAD / SIEDP), or for children with heart or kidney disease.")}</p>
    </div>
    <div class="card" style="--c:${t.c}"><h2>${L("Shock: bolo di liquidi","Shock: fluid bolus")}</h2>
      <div class="big"><div class="stat"><div class="k">${L("Cristalloide isotonico","Isotonic crystalloid")}</div><div class="v">${fmt(10*w,0)} mL</div><div class="u">${L("10 mL/kg in 5–10 min","10 mL/kg, over 5–10 min")}</div></div></div>
      <p class="note">${L(
        "Rivaluta dopo ogni bolo (segni di sovraccarico: crepitii, epatomegalia). Nello shock settico possono servire fino a 40–60 mL/kg nella prima ora; considera precocemente gli inotropi (ERC 2021).",
        "Reassess after every bolus (signs of overload: crackles, hepatomegaly). Up to 40–60 mL/kg may be needed in the first hour of septic shock; consider early inotropes (ERC 2021).")}</p>
    </div>
    <p class="src">${L(
      "Fonti: metodo di Holliday e Segar; linea guida ESPGHAN/ESPID sulla gastroenterite acuta del bambino in Europa (2014); linee guida ERC Paediatric Life Support 2021 (IRC in Italia). Usa SRO a ridotta osmolarità, come raccomandato da ESPGHAN.",
      "Sources: Holliday & Segar method; ESPGHAN/ESPID guideline on acute gastroenteritis in children in Europe (2014); ERC Paediatric Life Support guidelines 2021 (IRC in Italy). Use reduced-osmolarity ORS as recommended by ESPGHAN.")}</p>`;
    const dh = $("#dh");
    if (dehyd === "none") dh.innerHTML = `<p>${L("Prosegui l'allattamento e l'alimentazione abituale. Dai SRO per reintegrare le perdite in corso (sotto). Evita succhi di frutta e bibite.","Continue breastfeeding and a normal diet. Give ORS to replace ongoing losses (below). Avoid fruit juices and soft drinks.")}</p>`;
    if (dehyd === "mild") dh.innerHTML = `<div class="big"><div class="stat"><div class="k">${L("SRO in 3–4 ore","ORS over 3–4 hours")}</div><div class="v">${fmt(50*w,0)}–${fmt(100*w,0)} mL</div><div class="u">${L("50–100 mL/kg, a piccoli sorsi frequenti","50–100 mL/kg, small frequent sips")}</div></div></div>
      <p class="note">${L(
        "Prima scelta è la reidratazione orale; se non tollerata, SRO con sondino nasogastrico. Riprendi l'alimentazione normale appena reidratato. L'ondansetron può aiutare in caso di vomito (vedi la dose in Dosi in emergenza e il protocollo locale).",
        "First choice is oral rehydration; if not tolerated, give ORS by nasogastric tube. Restart normal feeding as soon as rehydrated. Ondansetron may help vomiting (check the dose in the Emergency doses tool and local protocol).")}</p>`;
    if (dehyd === "severe") dh.innerHTML = `<div class="warn">${L(
      `La disidratazione grave è un'emergenza: avvia liquidi EV o IO. Somministra un bolo di ${fmt(10*w,0)} mL (10 mL/kg) se ci sono segni di shock, poi correggi il deficit qui sotto. Controlla elettroliti e glicemia.`,
      `Severe dehydration is an emergency: start IV or IO fluids. Give a ${fmt(10*w,0)} mL bolus (10 mL/kg) if there are signs of shock, then replace the deficit below. Check electrolytes and glucose.`)}</div>`;
    app.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => { dehyd = b.dataset.d; update(); }));
    $("#defPct").addEventListener("input", e => {
      const v = parseFloat(e.target.value); if (!isFinite(v)) return; defPct = v;
      $("#defV").textContent = fmt(v*w*10,0) + " mL"; $("#defH").textContent = fmt((v*w*10 + m.day)/24,0) + " mL/h";
    });
  };
  update(); return { update };
}

/* ===== GROWTH ===== */
const G = { sex:"M", h:null, f:null, mo:null, ph:null, pm:null };
function growth(t){
  app.innerHTML = head(t, L("BMI, superficie corporea, statura bersaglio e velocità di crescita","BMI, body surface area, target height and growth velocity")) + `
  <div class="card" style="--c:${t.c}"><h2>${L("Misure","Measurements")}</h2>
    <div class="row inl">
      <div><label for="gS">${L("Sesso","Sex")}</label><select id="gS"><option value="M">${L("Maschio","Male")}</option><option value="F">${L("Femmina","Female")}</option></select></div>
      <div><label for="gH">${L("Statura, cm","Height, cm")}</label><input id="gH" type="number" step="0.1" inputmode="decimal"></div>

    </div>

  const bind = (id, k, num=true) => { const e = $(id); e.value = G[k] ?? ""; e.addEventListener("input", () => { const v = num ? parseFloat(e.value) : e.value; G[k] = num ? (isFinite(v) ? v : null) : v; update(); }); };

        <div class="stat"><div class="k">${L("Velocità di crescita","Growth velocity")}</div><div class="v">${fmt(vel)}</div><div class="u">${L("cm/anno","cm/year")}${G.pm && G.pm < 6 ? L(", poco affidabile sotto i 6 mesi",", less reliable under 6 months") : ""}</div></div>
      </div>
    </div>
    <div class="card"><h2>${L("Quali curve usare in Italia","Which charts to use in Italy")}</h2>
      <ul class="clean">${L(`
        <li><b>0–2 anni:</b> standard di crescita OMS (2006). Sotto i 2 anni usa il peso per lunghezza invece del BMI.</li>
        <li><b>2–20 anni:</b> curve di crescita italiane di Cacciari et al. (2006), raccomandate dalla SIEDP, per statura, peso e BMI.</li>
        <li><b>BMI:</b> va interpretato solo con i centili di BMI per età e sesso; i cut-off dell'adulto (25 e 30) non valgono nel bambino.</li>
        <li><b>Statura bersaglio:</b> (padre + madre ± 13 cm) ÷ 2, più 13 nei maschi e meno 13 nelle femmine; la maggior parte dei bambini rientra in circa ± 8,5 cm.</li>
        <li><b>Condizioni specifiche:</b> usa curve dedicate per sindrome di Down, sindrome di Turner e prematuri (età corretta fino a 2 anni).</li>`,`
        <li><b>0–2 years:</b> WHO Child Growth Standards (2006). Use weight-for-length rather than BMI under 2 years.</li>
        <li><b>2–20 years:</b> Italian growth charts by Cacciari et al. (2006), recommended by SIEDP, for height, weight and BMI.</li>
        <li><b>BMI:</b> interpret only against BMI-for-age centiles for sex; the adult cut-offs (25 and 30) do not apply to children.</li>
        <li><b>Target height:</b> (father + mother ± 13 cm) ÷ 2, plus 13 for boys and minus 13 for girls; most children end within about ± 8.5 cm.</li>
        <li><b>Specific conditions:</b> use dedicated charts for Down syndrome, Turner syndrome and preterm infants (corrected age up to 2 years).</li>`)}
      </ul>
      <p class="note">${L("Questo strumento non calcola centili o z-score, perché servono le tabelle di riferimento pubblicate. Riporta i valori sulle curve indicate sopra.","This tool does not calculate centiles or z-scores, because that needs the published reference tables. Plot the values on the charts above.")}</p>
    </div>`;
  };
  update(); return { update };
}

function dline(name, how, perKg, w, max, unit, conc, concLabel, opts={}){
  let v = perKg * w, capped = false;
  if (max != null && v > max){ v = max; capped = true; }
  const d = opts.dec ?? (v < 0.1 ? 3 : v < 1 ? 2 : 1);
  const vol = conc ? `${fmt(v/conc, v/conc < 1 ? 2 : 1)} mL ${L("di","of")} ${concLabel}` : (opts.volText || "");
  return `<div class="drug"><div><div class="n">${name}</div><div class="how">${how}</div></div>
    <div><div class="dose">${fmt(v,d)} ${unit}${capped ? `<span class="cap">max</span>` : ""}</div><div class="vol">${vol}</div></div></div>`;
}
function fixed(name, how, dose, vol=""){
  return `<div class="drug"><div><div class="n">${name}</div><div class="how">${how}</div></div><div><div class="dose">${dose}</div><div class="vol">${vol}</div></div></div>`;
}

function freqText(div){
  return { 1:L("una volta al giorno","once daily"), 2:L("ogni 12 h","every 12 h"), 3:L("ogni 8 h","every 8 h"), 4:L("ogni 6 h","every 6 h") }[div];

// mg: mg/kg/day (number or [low, high]); div: doses per day; max: max mg per dose
function ax(name, how, mg, div, w, max, conc, concL){
  const [a, b] = Array.isArray(mg) ? mg : [mg, mg];
  let lo = a * w / div, hi = b * w / div, capped = false;
  if (max != null){ if (hi > max){ hi = max; capped = true; } if (lo > max) lo = max; }
  const dp = x => x >= 10 ? 0 : 1;
  const dose = lo === hi ? `${fmt(lo, dp(lo))} mg` : `${fmt(lo, dp(lo))}–${fmt(hi, dp(hi))} mg`;
  const vol = conc ? (lo === hi ? `${fmt(lo/conc)} mL` : `${fmt(lo/conc)}–${fmt(hi/conc)} mL`) + ` ${L("di","of")} ${concL}` : "";
  return `<div class="drug"><div><div class="n">${name}</div><div class="how">${how}</div></div>
    <div><div class="dose">${dose}${capped ? `<span class="cap">max</span>` : ""}</div><div class="vol">${freqText(div)}${vol ? "<br>" + vol : ""}</div></div></div>`;
}

        <li>Admit if SpO₂ is below 92%, there is marked respiratory distress, dehydration, age under 6 months or no response after 48–72 h.</li>`))
      + sec(L("Prima scelta (a domicilio)","First choice (outpatient)"),
        ax(L("Amoxicillina per bocca","Amoxicillin oral"), L("90 mg/kg/die in 3 dosi (anche 2).","90 mg/kg/day in 3 doses (2 also acceptable)."), 90, 3, w, 1000, 50, "250 mg/5 mL")
        + ax(L("Amoxicillina-clavulanato per bocca","Amoxicillin-clavulanate oral"), L("Se vaccinazione anti-Hib incompleta o dopo influenza. 90 mg/kg/die di amoxicillina in 2 dosi.","If Hib vaccination is incomplete or after influenza. 90 mg/kg/day of amoxicillin in 2 doses."), 90, 2, w, 1000, 80, "400/57 mg/5 mL"))
      + sec(L("Sospetta forma atipica (Mycoplasma), di solito sopra i 5 anni","Suspected atypical (Mycoplasma), usually over 5 years"),
        ax(L("Claritromicina per bocca","Clarithromycin oral"), L("15 mg/kg/die in 2 dosi per 7 giorni.","15 mg/kg/day in 2 doses for 7 days."), 15, 2, w, 500, 25, "125 mg/5 mL")
        + fixed(L("Azitromicina per bocca","Azithromycin oral"), L("10 mg/kg il 1° giorno (max 500 mg), poi 5 mg/kg dal 2° al 5° giorno (max 250 mg). Sospensione 200 mg/5 mL.","10 mg/kg on day 1 (max 500 mg), then 5 mg/kg on days 2–5 (max 250 mg). Suspension 200 mg/5 mL."), `${fmt(capd(10*w,500),0)} mg → ${fmt(capd(5*w,250),0)} mg`, `${fmt(capd(10*w,500)/40)} mL → ${fmt(capd(5*w,250)/40)} mL`))
      + sec(L("In ospedale (EV)","Hospital (IV)"),
        ax(L("Ampicillina EV","Ampicillin IV"), L("150–200 mg/kg/die in 4 dosi.","150–200 mg/kg/day in 4 doses."), [150,200], 4, w, 2000)
        + ax(L("Ceftriaxone EV","Ceftriaxone IV"), L("Se vaccinazioni incomplete, forma grave o complicata. 50–100 mg/kg/die in dose unica.","If vaccinations are incomplete, or severe or complicated pneumonia. 50–100 mg/kg/day once daily."), [50,100], 1, w, 2000))
      + sec(L("Durata","Duration"), p("5–7 giorni nelle forme non complicate; passa alla via orale appena il bambino migliora e si alimenta.","5–7 days for uncomplicated pneumonia; switch to oral as soon as the child improves and is eating."));

    if (infSel === "uti") body =
      sec(L("Prima di iniziare","Before starting"), ul(`
        <li>Raccogli l'urinocoltura <b>prima</b> dell'antibiotico, con mitto intermedio o cateterismo (non con sacchetto).</li>
        <li>Terapia EV e ricovero sotto i 2 mesi, se il bambino appare settico, vomita o non assume la terapia orale.</li>
        <li>Adatta la terapia all'antibiogramma appena disponibile.</li>`,`
        <li>Collect a urine culture <b>before</b> the antibiotic, by clean catch or catheter (not a bag).</li>
        <li>IV treatment and admission under 2 months, if the child looks septic, is vomiting or cannot take oral treatment.</li>
        <li>Adjust treatment to the culture result as soon as it is available.</li>`))
      + sec(L("Prima scelta (per bocca)","First choice (oral)"),
        ax(L("Amoxicillina-clavulanato per bocca","Amoxicillin-clavulanate oral"), L("50 mg/kg/die di amoxicillina in 3 dosi (anche 2).","50 mg/kg/day of amoxicillin in 3 doses (2 also acceptable)."), 50, 3, w, 1000, 80, "400/57 mg/5 mL")
        + ax(L("Cefixima per bocca","Cefixime oral"), L("Alternativa, o se le resistenze locali all'amoxicillina-clavulanato sono alte. 8 mg/kg/die in 1 dose (o 2).","Alternative, or if local resistance to amoxicillin-clavulanate is high. 8 mg/kg/day in 1 dose (or 2)."), 8, 1, w, 400, 20, "100 mg/5 mL"))
      + sec(L("Terapia EV","IV treatment"),
        ax(L("Ceftriaxone EV","Ceftriaxone IV"), L("50 mg/kg/die in dose unica.","50 mg/kg/day once daily."), 50, 1, w, 2000)
        + ax(L("Amikacina EV","Amikacin IV"), L("Alternativa: 15 mg/kg/die in dose unica. Controlla la funzione renale.","Alternative: 15 mg/kg/day once daily. Check kidney function."), 15, 1, w, 1500))
      + sec(L("Durata","Duration"), p("10 giorni in totale; passa alla via orale dopo 2–4 giorni di terapia EV se il bambino migliora.","10 days in total; switch to oral after 2–4 days of IV treatment if the child improves."));

    if (infSel === "skin") body =
      sec(L("Impetigine localizzata","Localised impetigo"), p("Terapia topica con acido fusidico o mupirocina 3 volte al giorno per 5–7 giorni, dopo aver rimosso le croste.","Topical fusidic acid or mupirocin 3 times a day for 5–7 days, after removing the crusts."))
      + sec(L("Impetigine estesa, cellulite, morso di animale","Extensive impetigo, cellulitis, animal bite"),
        ax(L("Amoxicillina-clavulanato per bocca","Amoxicillin-clavulanate oral"), L("50 mg/kg/die di amoxicillina in 2–3 dosi (mostrato per 2).","50 mg/kg/day of amoxicillin in 2–3 doses (shown for 2)."), 50, 2, w, 1000, 80, "400/57 mg/5 mL")
        + ax(L("Clindamicina per bocca","Clindamycin oral"), L("Allergia grave alla penicillina. 30 mg/kg/die in 3 dosi.","Severe penicillin allergy. 30 mg/kg/day in 3 doses."), 30, 3, w, 450))
      + sec(L("Quando ricoverare","When to admit"), p("Cellulite estesa o in rapida progressione, cellulite periorbitaria con segni orbitari (dolore ai movimenti oculari, proptosi, deficit del visus), febbre alta con aspetto sofferente, età sotto 1 anno: terapia EV. Durata 5–7 giorni nelle forme non complicate.","Extensive or rapidly spreading cellulitis, periorbital cellulitis with orbital signs (pain on eye movement, proptosis, reduced vision), high fever with an unwell child, age under 1 year: IV treatment. Duration 5–7 days if uncomplicated."));

    if (infSel === "sepsis") body =
      `<div class="warn">${L("Emergenza: somministra l'antibiotico entro 1 ora. Fai l'emocoltura prima se non ritarda la terapia; la puntura lombare non deve ritardare l'antibiotico.","Emergency: give the antibiotic within 1 hour. Take a blood culture first if it does not delay treatment; a lumbar puncture must not delay the antibiotic.")}</div>`
      + sec(L("Oltre il primo mese di vita","Beyond the first month of life"),
        ax(L("Ceftriaxone EV","Ceftriaxone IV"), L("100 mg/kg/die in 1–2 dosi (mostrato per 2), max 4 g/die.","100 mg/kg/day in 1–2 doses (shown for 2), max 4 g/day."), 100, 2, w, 2000)
        + ax(L("Cefotaxima EV","Cefotaxime IV"), L("Alternativa: 200–300 mg/kg/die in 4 dosi (300 nella meningite), max 12 g/die.","Alternative: 200–300 mg/kg/day in 4 doses (300 in meningitis), max 12 g/day."), [200,300], 4, w, 3000)
        + ax(L("Vancomicina EV","Vancomycin IV"), L("Da aggiungere se si sospetta pneumococco resistente o MRSA, secondo i dati locali. 60 mg/kg/die in 4 dosi; monitora i livelli.","Add if resistant pneumococcus or MRSA is suspected, according to local data. 60 mg/kg/day in 4 doses; monitor levels."), 60, 4, w, null)
        + ax(L("Desametasone EV","Dexamethasone IV"), L("Sospetta meningite batterica: 0,15 mg/kg ogni 6 h per 2–4 giorni, prima o insieme alla prima dose di antibiotico.","Suspected bacterial meningitis: 0.15 mg/kg every 6 h for 2–4 days, before or with the first antibiotic dose."), 0.6, 4, w, 10))
      + sec(L("Neonato (primo mese)","Neonate (first month)"), p("Ampicillina più cefotaxima (o gentamicina), con dosi neonatali per età gestazionale e postnatale. Aggiungi aciclovir se si sospetta infezione da herpes simplex. Evita il ceftriaxone nel neonato.","Ampicillin plus cefotaxime (or gentamicin), at neonatal doses for gestational and postnatal age. Add aciclovir if herpes simplex infection is suspected. Avoid ceftriaxone in neonates."))
      + sec(L("Profilassi dei contatti stretti (meningococco)","Prophylaxis for close contacts (meningococcus)"),
        ax(L("Rifampicina per bocca","Rifampicin oral"), L("10 mg/kg ogni 12 h per 2 giorni (5 mg/kg sotto 1 mese).","10 mg/kg every 12 h for 2 days (5 mg/kg under 1 month)."), mo != null && mo < 1 ? 10 : 20, 2, w, 600)
        + fixed(L("Ceftriaxone IM","Ceftriaxone IM"), L("Dose singola: 125 mg sotto 12 anni, 250 mg da 12 anni.","Single dose: 125 mg under 12 years, 250 mg from 12 years."), mo == null ? L("inserisci l'età","set age") : (mo < 144 ? "125 mg" : "250 mg"))
        + p("La meningite è una malattia a notifica obbligatoria: segnala subito il caso al Servizio di Igiene e Sanità Pubblica, che gestisce i contatti.","Meningitis is a notifiable disease: report the case immediately to the public health service (Servizio di Igiene e Sanità Pubblica), which manages the contacts."));

    if (infSel === "pert") body =
      sec(L("Trattamento e profilassi dei contatti","Treatment and contact prophylaxis"),
        (mo != null && mo < 6
          ? ax(L("Azitromicina per bocca","Azithromycin oral"), L("Sotto i 6 mesi: 10 mg/kg/die per 5 giorni. Sotto 1 mese è il macrolide preferito; controlla il rischio di stenosi pilorica.","Under 6 months: 10 mg/kg/day for 5 days. Preferred macrolide under 1 month; watch for pyloric stenosis."), 10, 1, w, 500, 40, "200 mg/5 mL")
          : fixed(L("Azitromicina per bocca","Azithromycin oral"), L("Dai 6 mesi: 10 mg/kg il 1° giorno (max 500 mg), poi 5 mg/kg dal 2° al 5° giorno (max 250 mg). Sospensione 200 mg/5 mL.","From 6 months: 10 mg/kg on day 1 (max 500 mg), then 5 mg/kg on days 2–5 (max 250 mg). Suspension 200 mg/5 mL."), `${fmt(capd(10*w,500),0)} mg → ${fmt(capd(5*w,250),0)} mg`, `${fmt(capd(10*w,500)/40)} mL → ${fmt(capd(5*w,250)/40)} mL`))
        + ax(L("Claritromicina per bocca","Clarithromycin oral"), L("Alternativa dopo il primo mese: 15 mg/kg/die in 2 dosi per 7 giorni.","Alternative after the first month: 15 mg/kg/day in 2 doses for 7 days."), 15, 2, w, 500, 25, "125 mg/5 mL")
        + p("La terapia riduce il contagio soprattutto se iniziata nelle prime 3 settimane di tosse. I lattanti sotto i 6 mesi rischiano apnee e vanno spesso ricoverati. La pertosse è a notifica obbligatoria.","Treatment mainly reduces spread if started within 3 weeks of the cough. Infants under 6 months are at risk of apnoea and often need admission. Pertussis is notifiable."));

    if (infSel === "endo") body =
      sec(L("Solo per pazienti ad alto rischio","Only for high-risk patients"), ul(`
        <li>Precedente endocardite, protesi valvolari, cardiopatie congenite cianogene non corrette o corrette con materiale protesico (nei primi 6 mesi, o a vita se c'è un difetto residuo).</li>
        <li>Indicata per procedure odontoiatriche con manipolazione della gengiva o della regione periapicale.</li>`,`
        <li>Previous endocarditis, prosthetic valves, unrepaired cyanotic congenital heart disease or repair with prosthetic material (for 6 months, or for life with a residual defect).</li>
        <li>Indicated for dental procedures involving the gums or the periapical region.</li>`))
      + sec(L("Dose singola 30–60 minuti prima","Single dose 30–60 minutes before"),
        fixed(L("Amoxicillina per bocca","Amoxicillin oral"), L("50 mg/kg, max 2 g.","50 mg/kg, max 2 g."), `${fmt(capd(50*w,2000),0)} mg`, `${fmt(capd(50*w,2000)/50)} mL ${L("di","of")} 250 mg/5 mL`)
        + fixed(L("Azitromicina per bocca","Azithromycin oral"), L("Allergia alla penicillina: 15 mg/kg, max 500 mg.","Penicillin allergy: 15 mg/kg, max 500 mg."), `${fmt(capd(15*w,500),0)} mg`, `${fmt(capd(15*w,500)/40)} mL ${L("di","of")} 200 mg/5 mL`));

    $("#out").innerHTML = pick + warn + body + `
    <div class="card"><h2>${L("Uso responsabile degli antibiotici","Responsible antibiotic use")}</h2>
      <ul class="clean">${L(`
        <li><b>Allergia alla penicillina:</b> la maggior parte delle etichette non è confermata. Dopo un esantema lieve e tardivo si possono usare le cefalosporine; invia all'allergologo per la valutazione.</li>
        <li><b>Preferisci gli antibiotici “Access”</b> della classificazione OMS AWaRe (come l'amoxicillina) e riserva cefalosporine di 3ª generazione e macrolidi a indicazioni precise.</li>
        <li>Rivaluta la terapia a 48–72 h e adattala alle colture.</li>`,`
        <li><b>Penicillin allergy:</b> most labels are not confirmed. After a mild delayed rash, cephalosporins can be used; refer for allergy assessment.</li>
        <li><b>Prefer “Access” antibiotics</b> in the WHO AWaRe classification (such as amoxicillin) and keep third-generation cephalosporins and macrolides for specific indications.</li>
        <li>Review treatment at 48–72 h and adjust it to culture results.</li>`)}
      </ul>
    </div>
    <p class="src">${L(
      "Fonti: linee guida intersocietarie italiane su otite media acuta (SIP, aggiornamento 2019), faringotonsillite (2012), polmonite acquisita in comunità (consensus 2020) e prima infezione urinaria febbrile (raccomandazioni 2020); linee guida ESC 2023 sull'endocardite; Piano Nazionale di Contrasto all'Antibiotico-Resistenza (PNCAR) 2022–2025. Le concentrazioni delle sospensioni sono quelle più comuni in Italia: verifica il prodotto prescritto e le resistenze locali.",
      "Sources: Italian intersociety guidelines on acute otitis media (SIP, 2019 update), pharyngotonsillitis (2012), community-acquired pneumonia (2020 consensus) and first febrile urinary tract infection (2020 recommendations); ESC 2023 endocarditis guidelines; Italian national plan against antibiotic resistance (PNCAR) 2022–2025. Suspension strengths are the most common ones in Italy: check the product prescribed and local resistance data.")}</p>`;
    bindPick();
  };
  const bindPick = () => app.querySelectorAll("[data-i]").forEach(b => b.addEventListener("click", () => { infSel = b.dataset.i; update(); }));
  update(); return { update };
}

/* ---------- routing ---------- */
const VIEWS = { vitals, fluids, growth, milestones, vaccines, doses, antibiotics };
function route(keepScroll){
  const id = location.hash.slice(1);
  const t = TOOLS.find(x => x.id === id);
  current = t ? VIEWS[id](t) : home();
  if (!keepScroll) window.scrollTo(0, 0);
  document.title = (t ? tt(t) + " – " : "") + "Prontuario pediatrico";
}
window.addEventListener("hashchange", () => route(false));

/* language */
$("#langBtn").addEventListener("click", () => {
  lang = lang === "it" ? "en" : "it";
  try { localStorage.setItem("prontuario.lang", lang); } catch(e){}
  applyStatic(); route(true);
});

/* theme */
$("#themeBtn").addEventListener("click", () => {
  const r = document.documentElement; const cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  r.dataset.theme = cur === "dark" ? "light" : "dark"; try { localStorage.setItem("prontuario.theme", r.dataset.theme); } catch(e){}
});
try { const th = localStorage.getItem("prontuario.theme"); if (th) document.documentElement.dataset.theme = th; } catch(e){}

applyStatic();
route(false);
})();
</script>
</body>
</html>

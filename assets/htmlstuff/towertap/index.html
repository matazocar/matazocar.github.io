<style>
  :root {
    --ink: #fff8ec;
    --ink-soft: rgba(255, 248, 236, 0.72);
    --night: #1b1430;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --night: #1b1430; } }
  :root[data-theme="dark"] { --night: #1b1430; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--night);
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud {
    position: fixed; left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 28px);
    text-align: center; pointer-events: none; color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #score {
    font-family: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    font-size: clamp(56px, 18vw, 96px); line-height: 1;
    text-shadow: 0 4px 0 rgba(0,0,0,0.18);
    transition: transform 0.12s ease-out;
  }
  #score.pop { transform: scale(1.18); }
  #combo {
    margin-top: 6px; font-weight: 800; font-size: 18px;
    opacity: 0; transition: opacity 0.25s;
  }
  #combo.show { opacity: 1; }
  .panel {
    position: fixed; left: 50%;
    top: calc(env(safe-area-inset-top, 0px) + 68px);
    transform: translateX(-50%);
    width: min(88vw, 380px); box-sizing: border-box;
    padding: 20px 20px 18px; border-radius: 26px;
    background: rgba(18, 12, 38, 0.72);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 18px 50px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,248,236,0.08);
    text-align: center; color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    transition: opacity 0.3s, transform 0.3s;
  }
  .panel.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(10px); }
  .panel h1 {
    font-family: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    font-weight: 400; font-size: clamp(40px, 12vw, 64px); margin: 0 0 10px; line-height: 1;
  }
  .panel p { margin: 6px auto; max-width: 30ch; font-weight: 600; font-size: 17px; line-height: 1.4; color: var(--ink-soft); }
  .panel .tap {
    margin-top: 18px; font-weight: 800; font-size: 18px; color: var(--ink);
    animation: breathe 1.4s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: 0.45; } }
  .share { display: none; margin-top: 4px; text-align: left; }
  .hud { transition: opacity 0.3s; }
  body.is-over .hud { opacity: 0; }
  .panel.over .share { display: block; }
  .panel.over #pline2 { display: none; }
  .panel.over { max-height: calc(100% - 90px); overflow-y: auto; }
  .preview-label { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 14px 2px 6px; }
  .preview-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .shuffle {
    display: inline-flex; align-items: center; gap: 6px; margin: 0 0 6px; padding: 7px 11px;
    border: 0; border-radius: 999px; background: rgba(255,248,236,0.12); color: var(--ink);
    font: 800 13px "Nunito", system-ui, sans-serif; cursor: pointer;
  }
  .shuffle:active { transform: scale(0.95); }
  .shuffle:focus-visible { outline: 3px solid #fff8ec; outline-offset: 2px; }
  .bubble { transition: opacity 0.15s;
    position: relative; padding: 12px 14px; border-radius: 18px 18px 18px 6px;
    background: rgba(255,248,236,0.1); color: var(--ink);
    font-weight: 700; font-size: 15px; line-height: 1.4;
  }
  .share-main {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 16px;
    background: #ffd166; color: #2a1a00; font: 800 18px "Nunito", system-ui, sans-serif;
    cursor: pointer; box-shadow: 0 4px 0 #c99a2e;
  }
  .share-main:active { transform: translateY(3px); box-shadow: 0 1px 0 #c99a2e; }
  .share-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .share-row a, .share-row button {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    min-height: 72px; padding: 8px 2px; border-radius: 16px; border: 0;
    background: rgba(255,248,236,0.08); color: var(--ink); text-decoration: none;
    font: 800 12px "Nunito", system-ui, sans-serif; cursor: pointer;
  }
  .share-row a:active, .share-row button:active { transform: scale(0.95); }
  .share-row .ic {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .share-row svg { width: 22px; height: 22px; display: block; }
  .ic.wa { background: linear-gradient(160deg, #3ad46f, #1c9a4f); border-radius: 50%; }
  .ic.wa svg { width: 25px; height: 25px; }
  .ic.tg { background: #2a93d8; }
  .ic.sms { background: #34c759; }
  .ic.cp { background: #6c5fc7; }
  .share-main:focus-visible, .share-row a:focus-visible, .share-row button:focus-visible, .icon-btn:focus-visible, .again:focus-visible {
    outline: 3px solid #fff8ec; outline-offset: 2px;
  }
  .end-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: 14px; }
  .again {
    padding: 13px 8px; border-radius: 16px; cursor: pointer;
    border: 2px solid rgba(255,248,236,0.5); background: transparent; color: var(--ink);
    font: 800 16px "Nunito", system-ui, sans-serif;
  }
  .again.go { background: #fff8ec; color: #1b1430; border-color: #fff8ec; }
  .icon-btn {
    z-index: 6; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px;
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: rgba(255,248,236,0.14); color: var(--ink); font-size: 20px; cursor: pointer;
  }
  /* ---------- retro leaderboard ---------- */
  .board {
    --px: "Press Start 2P", "Courier New", ui-monospace, monospace;
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; justify-content: safe center;
    padding: calc(env(safe-area-inset-top, 0px) + 68px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
    box-sizing: border-box; overflow-y: auto;
    background: #05030c; color: #fff; font-family: var(--px);
    image-rendering: pixelated;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .board::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.28) 0 2px, transparent 2px 4px);
  }
  .board.open { opacity: 1; pointer-events: auto; }
  .board h2 {
    margin: 0 0 6px; font: 400 clamp(18px, 5.6vw, 26px)/1.3 var(--px);
    color: #ffd166; text-shadow: 3px 3px 0 #c2185b; letter-spacing: 1px; text-align: center;
  }
  .board .sub { font-size: 10px; color: #7ee8fa; margin: 0 0 18px; text-align: center; line-height: 1.6; }
  .blink { animation: blink 0.9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .entry { display: none; flex-direction: column; align-items: center; }
  .board.entering .entry { display: flex; }
  .board.entering .table, .board.entering .bbtns { display: none; }
  .slots { display: flex; gap: 14px; margin: 4px 0 20px; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .slot button {
    width: 58px; height: 44px; border: 0; background: #1d1840; color: #7ee8fa;
    font: 400 14px var(--px); cursor: pointer; box-shadow: inset -3px -3px 0 #0c0a22;
  }
  .slot button:active { transform: translateY(2px); box-shadow: none; }
  .slot .ch {
    width: 58px; height: 64px; display: flex; align-items: center; justify-content: center;
    font: 400 30px var(--px); color: #fff; border-bottom: 4px solid #3a3470; cursor: pointer;
  }
  .slot.sel .ch { color: #ffd166; border-color: #ffd166; }
  .slot.sel .ch span { animation: blink 0.8s steps(1) infinite; }
  .rbtn {
    border: 0; padding: 14px 18px; cursor: pointer; font: 400 13px var(--px);
    background: #ffd166; color: #1b1430; box-shadow: inset -4px -4px 0 #c99a2e;
  }
  .rbtn:active { transform: translateY(2px); box-shadow: none; }
  .rbtn.alt { background: #2a2456; color: #fff; box-shadow: inset -4px -4px 0 #15112f; }
  .rbtn:focus-visible, .slot button:focus-visible { outline: 3px solid #7ee8fa; outline-offset: 3px; }
  .table { width: min(100%, 360px); border-collapse: collapse; font-size: clamp(11px, 3.6vw, 14px); }
  .table td { padding: 7px 4px; white-space: nowrap; }
  .table td:nth-child(1) { text-align: left; width: 4.5em; }
  .table td:nth-child(2) { text-align: center; letter-spacing: 3px; }
  .table td:nth-child(3) { text-align: right; }
  .table tr.mine td { animation: blink 0.7s steps(1) infinite; }
  .bbtns { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; justify-content: center; }
  @media (prefers-reduced-motion: reduce) { .blink, .slot.sel .ch span, .table tr.mine td { animation: none; } .table tr.mine td { text-decoration: underline; } }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    transform: translateX(-50%); padding: 10px 18px; border-radius: 999px;
    background: #fff8ec; color: #1b1430; font: 800 15px "Nunito", system-ui, sans-serif;
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .panel .tap { animation: none; } #score { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div id="score"></div><div id="combo"></div></div>
<div class="panel" id="panel">
  <h1 id="ptitle">Tower Tap</h1>
  <p id="pline1">Tap to drop each block. Whatever hangs over the edge falls off.</p>
  <p id="pline2">Land it perfectly to keep your tower wide.</p>
  <div class="tap" id="ptap">Tap to start</div>
  <div class="share">
    <div class="preview-head">
      <div class="preview-label">Your message</div>
      <button class="shuffle" id="shuffle" type="button" aria-label="Try a different message"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Another one</button>
    </div>
    <div class="bubble" id="preview"></div>
    <button class="share-main" id="shareNative" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg><span>Share my score</span></button>
    <div class="share-row">
      <a id="shWa" target="_blank" rel="noopener"><span class="ic wa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8a9.2 9.2 0 0 0-7.9 13.9L2.9 21.2l4.6-1.2A9.2 9.2 0 1 0 12 2.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6.8 12.4l2 2 3.6-4.2M11.2 14.4l.4.4 3.6-4.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>WhatsApp</a>
      <a id="shTg" target="_blank" rel="noopener"><span class="ic tg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3.5 2.8 10.6c-.8.3-.8 1.4 0 1.7l4.6 1.7 1.8 5.6c.2.7 1.1.9 1.6.4l2.6-2.5 4.7 3.5c.6.4 1.4.1 1.6-.6L21.9 4.6c.2-.8-.5-1.4-.9-1.1z"/><path d="m7.4 14 11-7.5-8.4 9.2"/></svg></span>Telegram</a>
      <a id="shSms"><span class="ic sms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><circle cx="8" cy="11" r=".6" fill="currentColor"/><circle cx="12" cy="11" r=".6" fill="currentColor"/><circle cx="16" cy="11" r=".6" fill="currentColor"/></svg></span>Messages</a>
      <button id="shCopy" type="button"><span class="ic cp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></span>Copy</button>
    </div>
    <div class="end-row">
      <button class="again" id="toBoard" type="button">Scores</button>
      <button class="again go" id="again" type="button">Play again</button>
    </div>
  </div>
</div>
<div class="board" id="board" aria-live="polite">
  <h2 id="bTitle">HIGH SCORES</h2>
  <p class="sub" id="bSub"></p>
  <div class="entry">
    <div class="slots" id="slots"></div>
    <button class="rbtn" id="bOk" type="button">ENTER</button>
  </div>
  <table class="table"><tbody id="bRows"></tbody></table>
  <div class="bbtns">
    <button class="rbtn" id="bAgain" type="button">PLAY AGAIN</button>
    <button class="rbtn alt" id="bShare" type="button">SHARE</button>
  </div>
</div>
<button class="icon-btn" id="mute" type="button" aria-label="Mute sound">🔊</button>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const panel = document.getElementById('panel');
  const ptitle = document.getElementById('ptitle');
  const pline1 = document.getElementById('pline1');
  const pline2 = document.getElementById('pline2');
  const ptap = document.getElementById('ptap');

  let W, H, BH, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    BH = Math.max(22, Math.min(W, H) * 0.075);
  }
  resize();
  window.addEventListener('resize', resize);

  let best = 0;
  try { best = parseInt(localStorage.getItem('towertap-best') || '0', 10) || 0; } catch (e) {}

  // state
  let state = 'menu'; // menu | play | over
  let stack, cur, debris, rings, score, combo, baseHue, cam, camTarget, overAt, speed;

  // ---------- sound ----------
  let ac = null, master = null, muted = false;
  try { muted = localStorage.getItem('towertap-muted') === '1'; } catch (e) {}
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.55;
      const comp = ac.createDynamicsCompressor();
      master.connect(comp); comp.connect(ac.destination);
    } catch (e) { ac = null; }
  }
  const RATIOS = [1, 9/8, 5/4, 3/2, 5/3];
  const note = n => 261.63 * Math.pow(2, Math.floor(n / 5)) * RATIOS[((n % 5) + 5) % 5];
  function tone(freq, { type = 'sine', dur = 0.25, vol = 0.3, at = 0, slide = 0, attack = 0.005 } = {}) {
    if (!ac || muted) return;
    const t = ac.currentTime + at;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  let noiseBuf = null;
  function noise({ dur = 0.12, vol = 0.25, freq = 1800, q = 0.8, at = 0 } = {}) {
    if (!ac || muted) return;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = ac.currentTime + at;
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  }
  const sfx = {
    start() { tone(note(5), { type: 'triangle', dur: 0.15, vol: 0.25 }); tone(note(9), { type: 'triangle', dur: 0.25, vol: 0.25, at: 0.09 }); },
    place(n) {
      tone(120, { type: 'sine', dur: 0.12, vol: 0.45, slide: 0.5 });
      tone(note(5 + (n % 8)), { type: 'triangle', dur: 0.18, vol: 0.18 });
    },
    slice() { noise({ dur: 0.14, vol: 0.35, freq: 2400, q: 1.2 }); tone(90, { type: 'sine', dur: 0.1, vol: 0.3, slide: 0.6 }); },
    perfect(c) {
      const n = 7 + Math.min(c, 3); // climbs for 3 perfects, then always rings the same bright C-major bell (C6, E6, C7)
      tone(note(n), { type: 'sine', dur: 0.6, vol: 0.32 });
      tone(note(n) * 2.005, { type: 'sine', dur: 0.4, vol: 0.08 });
      tone(note(n + 2), { type: 'sine', dur: 0.5, vol: 0.18, at: 0.07 });
      if (c >= 3) tone(note(n + 5), { type: 'sine', dur: 0.6, vol: 0.16, at: 0.14 });
    },
    over() {
      tone(330, { type: 'sawtooth', dur: 0.7, vol: 0.12, slide: 0.35 });
      tone(220, { type: 'triangle', dur: 0.8, vol: 0.2, slide: 0.4, at: 0.05 });
      noise({ dur: 0.35, vol: 0.3, freq: 300, q: 0.6, at: 0.45 });
      tone(70, { type: 'sine', dur: 0.3, vol: 0.5, slide: 0.5, at: 0.45 });
    },
    best() { [0, 2, 4, 7].forEach((k, j) => tone(note(10 + k), { type: 'triangle', dur: 0.35, vol: 0.2, at: 0.9 + j * 0.09 })); },
    click() { tone(note(12), { type: 'sine', dur: 0.08, vol: 0.15 }); },
    blip(up) { tone(up ? 880 : 660, { type: 'square', dur: 0.06, vol: 0.08 }); },
    confirm() { [523, 659, 784, 1047].forEach((f, j) => tone(f, { type: 'square', dur: 0.1, vol: 0.08, at: j * 0.07 })); },
    fanfare() { [392, 523, 659, 784, 659, 784].forEach((f, j) => tone(f, { type: 'square', dur: 0.12, vol: 0.07, at: 0.15 + j * 0.1 })); }
  };
  const muteBtn = document.getElementById('mute');
  function syncMute() {
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', muted ? 'Turn sound on' : 'Mute sound');
    if (master) master.gain.value = muted ? 0 : 0.55;
  }
  syncMute();
  muteBtn.addEventListener('click', () => {
    muted = !muted; initAudio(); syncMute();
    try { localStorage.setItem('towertap-muted', muted ? '1' : '0'); } catch (e) {}
    sfx.click();
  });

  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  function reset() {
    baseHue = Math.floor(Math.random() * 360);
    const w = Math.min(W * 0.62, 320);
    stack = [];
    for (let i = 0; i < 4; i++) stack.push({ x: (W - w) / 2, w, i });
    debris = []; rings = [];
    score = 0; combo = 0;
    cam = 0; camTarget = 0;
    spawn();
    updateScore(false);
  }

  function spawn() {
    const top = stack[stack.length - 1];
    const fromLeft = stack.length % 2 === 0;
    speed = Math.min(2.4 + score * 0.07, 7.5) * Math.max(W, 320) / 400;
    cur = { x: fromLeft ? -top.w * 0.6 : W - top.w * 0.4, w: top.w, dir: fromLeft ? 1 : -1, i: stack.length };
  }

  const hue = i => (baseHue + i * 7) % 360;
  const groundY = () => H - Math.max(70, H * 0.12);
  const screenY = i => groundY() - (i + 1) * BH + cam;

  function updateScore(pop = true) {
    scoreEl.textContent = state === 'menu' ? '' : score;
    if (pop) {
      scoreEl.classList.add('pop');
      setTimeout(() => scoreEl.classList.remove('pop'), 120);
    }
  }

  let comboTimer;
  function showCombo(text) {
    comboEl.textContent = text;
    comboEl.classList.add('show');
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => comboEl.classList.remove('show'), 700);
  }

  function drop() {
    const top = stack[stack.length - 1];
    const left = Math.max(cur.x, top.x);
    const right = Math.min(cur.x + cur.w, top.x + top.w);
    const overlap = right - left;

    if (overlap <= 0) {
      debris.push(mkDebris(cur.x, cur.w, cur.i, cur.dir * 1.5));
      sfx.over();
      gameOver();
      return;
    }

    const tol = Math.max(3, W * 0.012);
    if (Math.abs(cur.x - top.x) <= tol) {
      combo++;
      let nw = top.w, nx = top.x;
      if (combo >= 3) {
        const grow = Math.min(BH * 0.5, Math.min(W * 0.62, 320) - nw);
        if (grow > 0) { nw += grow; nx -= grow / 2; }
      }
      stack.push({ x: nx, w: nw, i: cur.i });
      rings.push({ x: nx, w: nw, i: cur.i, t: 0 });
      showCombo(combo >= 3 ? `Perfect ×${combo}` : 'Perfect');
      buzz(combo >= 3 ? [12, 30, 12] : 12);
      sfx.place(score); sfx.perfect(combo);
    } else {
      combo = 0;
      if (cur.x < top.x) debris.push(mkDebris(cur.x, top.x - cur.x, cur.i, -1));
      if (cur.x + cur.w > top.x + top.w) debris.push(mkDebris(top.x + top.w, cur.x + cur.w - (top.x + top.w), cur.i, 1));
      stack.push({ x: left, w: overlap, i: cur.i });
      buzz(8);
      sfx.place(score); sfx.slice();
    }
    score++;
    updateScore();
    camTarget = Math.max(0, (stack.length + 1) * BH - (groundY() - H * 0.45));
    spawn();
  }

  function mkDebris(x, w, i, dir) {
    return { x, w, y: screenY(i) - cam, i, vx: dir * (0.6 + Math.random()), vy: 0, rot: 0, vr: dir * (0.02 + Math.random() * 0.03) };
  }

  function gameOver() {
    state = 'over';
    overAt = performance.now();
    cur = null;
    buzz([30, 40, 60]);
    const isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem('towertap-best', String(best)); } catch (e) {} }
    const bw = score === 1 ? 'block' : 'blocks';
    ptitle.textContent = isBest && score > 0 ? 'New best!' : `${score} ${bw}`;
    pline1.textContent = isBest && score > 0 ? `You stacked ${score} ${bw}.` : `Your best is ${best}.`;
    pline2.textContent = score < 10 ? 'Tip: tap a little early. The block keeps moving.' : (score < 30 ? 'Three perfects in a row make the block grow back.' : 'That is a serious tower.');
    if (isBest && score > 0) sfx.best();
    ptap.style.display = 'none';
    panel.classList.add('over');
    document.body.classList.add('is-over');
    lastWasBest = isBest;
    pickMessage();
    setShareLinks();
    fitTowerBelowPanel();
    setTimeout(() => { if (state === 'over') openBoard(); }, 900);
  }

  window.addEventListener('resize', () => { if (state === 'over') fitTowerBelowPanel(); });

  // shrink the view so the whole tower sits below the text card
  function fitTowerBelowPanel() {
    const rect = panel.getBoundingClientRect();
    const room = Math.max(BH * 2, groundY() - (rect.bottom - 10) - 16);
    const towerH = (stack.length + 1) * BH;
    zoomOut = Math.max(0.08, Math.min(1, room / towerH));
  }

  let zoomOut = 1, zoom = 1;

  function start() {
    state = 'play';
    zoomOut = 1; zoom = 1;
    panel.classList.add('hidden');
    panel.classList.remove('over');
    document.body.classList.remove('is-over');
    closeBoard();
    reset();
    sfx.start();
  }
  function onTap(e) {
    initAudio();
    const t = e.target;
    if (t.closest && (t.closest('.icon-btn') || t.closest('.share') || t.closest('.board'))) return; // let buttons work
    e.preventDefault();
    if (state === 'play') { drop(); return; }
    if (state === 'over') return; // use the Play again button so a stray tap doesn't skip sharing
    start();
  }
  window.addEventListener('pointerdown', onTap, { passive: false });
  window.addEventListener('keydown', e => {
    if (boardOpen) { boardKey(e); return; }
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    if (state === 'over' && document.activeElement && document.activeElement.closest('.share')) return;
    initAudio(); e.preventDefault();
    if (state === 'play') drop(); else if (state === 'menu' || performance.now() - overAt > 600) start();
  });
  document.getElementById('again').addEventListener('click', () => { if (performance.now() - overAt > 400) start(); });

  // ---------- retro leaderboard ----------
  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!?*.-';
  const SEED = [['TAP',30],['ACE',25],['ZAP',20],['MAX',16],['JOY',12],['KAI',10],['EVE',8],['LOU',6],['SAM',4],['BOB',2]];
  const RANK_COLORS = ['#ffd166','#ff8c42','#ff5e7e','#e86bf0','#9b7bff','#7ee8fa','#5ef2a6','#c6f26b','#ffffff','#b8b3d9'];
  const boardEl = document.getElementById('board');
  const bTitle = document.getElementById('bTitle'), bSub = document.getElementById('bSub');
  const bRows = document.getElementById('bRows'), slotsEl = document.getElementById('slots');
  let boardOpen = false, entering = false, initials = [0, 0, 0], selSlot = 0, mineIdx = -1;

  function loadBoard() {
    try {
      const b = JSON.parse(localStorage.getItem('towertap-board') || 'null');
      if (Array.isArray(b) && b.length) return b.slice(0, 10);
    } catch (e) {}
    return SEED.map(([n, s]) => ({ n, s }));
  }
  function saveBoard(b) { try { localStorage.setItem('towertap-board', JSON.stringify(b)); } catch (e) {} }
  let board = loadBoard();
  try {
    const last = localStorage.getItem('towertap-initials');
    if (last && last.length === 3) initials = [...last].map(c => Math.max(0, CHARS.indexOf(c)));
  } catch (e) {}

  const ord = n => n + (n === 1 ? 'ST' : n === 2 ? 'ND' : n === 3 ? 'RD' : 'TH');
  function renderRows() {
    bRows.innerHTML = '';
    for (let i = 0; i < 10; i++) {
      const r = board[i];
      const tr = document.createElement('tr');
      if (i === mineIdx) tr.className = 'mine';
      tr.style.color = RANK_COLORS[i];
      const cells = [ord(i + 1), r ? r.n : '---', r ? String(r.s) : '0'];
      cells.forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); });
      bRows.appendChild(tr);
    }
  }
  function renderSlots() {
    slotsEl.innerHTML = '';
    initials.forEach((ci, k) => {
      const slot = document.createElement('div');
      slot.className = 'slot' + (k === selSlot ? ' sel' : '');
      const up = document.createElement('button');
      up.type = 'button'; up.textContent = '▲'; up.setAttribute('aria-label', `Letter ${k + 1} up`);
      up.onclick = () => { selSlot = k; cycle(1); };
      const ch = document.createElement('div');
      ch.className = 'ch'; ch.innerHTML = '<span></span>'; ch.firstChild.textContent = CHARS[ci];
      ch.onclick = () => { selSlot = k; sfx.blip(true); renderSlots(); };
      const dn = document.createElement('button');
      dn.type = 'button'; dn.textContent = '▼'; dn.setAttribute('aria-label', `Letter ${k + 1} down`);
      dn.onclick = () => { selSlot = k; cycle(-1); };
      slot.append(up, ch, dn);
      slotsEl.appendChild(slot);
    });
  }
  function cycle(d) {
    initials[selSlot] = (initials[selSlot] + d + CHARS.length) % CHARS.length;
    sfx.blip(d > 0); renderSlots();
  }
  const qualifies = sc => sc > 0 && (board.length < 10 || sc > board[board.length - 1].s);

  function openBoard() {
    mineIdx = -1;
    entering = qualifies(score);
    boardEl.classList.toggle('entering', entering);
    if (entering) {
      const rank = board.filter(r => r.s >= score).length + 1;
      bTitle.textContent = 'NEW HIGH SCORE!';
      bSub.innerHTML = `${ord(rank)} PLACE · ${score} ${score === 1 ? 'BLOCK' : 'BLOCKS'}<br><span class="blink">ENTER YOUR NAME</span>`;
      selSlot = 0; renderSlots();
      sfx.fanfare();
    } else {
      bTitle.textContent = 'HIGH SCORES';
      bSub.textContent = `YOU STACKED ${score} · BEST ${best}`;
      renderRows();
    }
    boardOpen = true;
    boardEl.classList.add('open');
  }
  function submitName() {
    const name = initials.map(i => CHARS[i]).join('');
    try { localStorage.setItem('towertap-initials', name); } catch (e) {}
    const entry = { n: name, s: score };
    board.push(entry);
    board.sort((a, b) => b.s - a.s);
    board = board.slice(0, 10);
    mineIdx = board.indexOf(entry);
    saveBoard(board);
    entering = false;
    boardEl.classList.remove('entering');
    bTitle.textContent = 'HIGH SCORES';
    bSub.textContent = `WELL DONE, ${name}!`;
    renderRows();
    sfx.confirm();
    document.getElementById('bAgain').focus({ preventScroll: true });
  }
  function closeBoard() {
    boardOpen = false; entering = false;
    boardEl.classList.remove('open', 'entering');
  }
  function boardKey(e) {
    if (!entering) {
      if (e.code === 'Enter' || e.code === 'Space') {
        if (document.activeElement && document.activeElement.closest('.board')) return;
        e.preventDefault(); start();
      }
      return;
    }
    const k = e.key;
    if (k === 'ArrowUp') { e.preventDefault(); cycle(1); }
    else if (k === 'ArrowDown') { e.preventDefault(); cycle(-1); }
    else if (k === 'ArrowLeft') { e.preventDefault(); selSlot = Math.max(0, selSlot - 1); sfx.blip(false); renderSlots(); }
    else if (k === 'ArrowRight') { e.preventDefault(); selSlot = Math.min(2, selSlot + 1); sfx.blip(true); renderSlots(); }
    else if (k === 'Backspace') { e.preventDefault(); selSlot = Math.max(0, selSlot - 1); renderSlots(); }
    else if (k === 'Enter') { e.preventDefault(); submitName(); }
    else if (k.length === 1 && CHARS.includes(k.toUpperCase())) {
      e.preventDefault();
      initials[selSlot] = CHARS.indexOf(k.toUpperCase());
      sfx.blip(true);
      if (selSlot < 2) selSlot++;
      renderSlots();
    }
  }
  document.getElementById('bOk').addEventListener('click', submitName);
  document.getElementById('bAgain').addEventListener('click', () => start());
  document.getElementById('toBoard').addEventListener('click', () => {
    sfx.click(); panel.classList.add('hidden');
    renderRows(); boardOpen = true; boardEl.classList.add('open');
  });
  document.getElementById('bShare').addEventListener('click', () => {
    sfx.click(); closeBoard();
    panel.classList.remove('hidden');
  });

  // ---------- sharing ----------
  const toastEl = document.getElementById('toast');
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }
  const MESSAGES = {
    low: [
      '🧱 I stacked {n} {b} in Tower Tap. Architects, please don\'t call me.',
      '🧱 {n} {b} in Tower Tap. My tower has the structural integrity of a wet sandwich. Your turn.',
      '🧱 Built a {n}-block tower in Tower Tap. It\'s not small, it\'s minimalist.',
      '🧱 {n} {b} in Tower Tap. I was just warming up. Obviously.',
      '🧱 My Tower Tap tower is {n} {b} tall. Even a pigeon wouldn\'t land on it. Beat that (please).',
      '🧱 Scored {n} in Tower Tap. The blocks had other plans.',
      '🧱 {n} {b}. Not a tower, more of a modest shed. Can you do better?',
      '🧱 Tower Tap: {n}. I blame the wind. There is no wind. Your turn.'
    ],
    mid: [
      '🧱 {n} blocks stacked in Tower Tap! I\'m basically a crane now.',
      '🧱 Just built a {n}-block tower. Local pigeons are applying for apartments. Can you beat it?',
      '🧱 {n} in Tower Tap. My hands were shaking, my tower was not. Your move.',
      '🧱 I stacked {n} blocks! Gravity tried. Gravity failed. Beat me.',
      '🧱 {n} blocks high in Tower Tap. Somebody notify the city planning office.',
      '🧱 Tower Tap score: {n}. I\'d sign autographs, but I\'m busy stacking.',
      '🧱 {n} blocks! My tower now has its own weather. Think you can top it?'
    ],
    high: [
      '🧱 {n} blocks in Tower Tap. Planes are rerouting around my tower. Good luck.',
      '🧱 I stacked {n}! The view from up here is great. You wouldn\'t know.',
      '🧱 {n} blocks. I didn\'t build a tower, I built a lifestyle. Try to beat it.',
      '🧱 Tower Tap score: {n}. Engineers are studying my technique.',
      '🧱 {n} blocks high. NASA called, they want their rocket back. Your turn.',
      '🧱 {n} in Tower Tap. I\'ve peaked. Literally. Come and get me.'
    ]
  };
  let msgIdx = -1, msgTier = '', lastWasBest = false;
  function pickMessage(forceNew) {
    const tier = score >= 30 ? 'high' : score >= 10 ? 'mid' : 'low';
    const list = MESSAGES[tier];
    let i = Math.floor(Math.random() * list.length);
    if (forceNew && tier === msgTier && list.length > 1 && i === msgIdx) i = (i + 1 + Math.floor(Math.random() * (list.length - 1))) % list.length;
    msgTier = tier; msgIdx = i;
  }
  function shareText() {
    if (msgIdx < 0) pickMessage();
    const b = score === 1 ? 'block' : 'blocks';
    let t = MESSAGES[msgTier][msgIdx].replace(/\{n\}/g, score).replace(/\{b\}/g, b);
    if (score > 0 && lastWasBest) t += ' 🏆 New personal best!';
    return t;
  }
  function setShareLinks() {
    document.getElementById('preview').textContent = shareText();
    const txt = encodeURIComponent(shareText());
    document.getElementById('shWa').href = `https://wa.me/?text=${txt}`;
    document.getElementById('shTg').href = `https://t.me/share/url?url=${encodeURIComponent('Tower Tap')}&text=${txt}`;
    const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    document.getElementById('shSms').href = iOS ? `sms:&body=${txt}` : `sms:?body=${txt}`;
  }
  async function copyText() {
    const t = shareText();
    try { await navigator.clipboard.writeText(t); toast('Score copied'); return; } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      toast('Score copied');
    } catch (e) { toast('Copy did not work on this browser'); }
  }
  const nativeBtn = document.getElementById('shareNative');
  nativeBtn.addEventListener('click', async () => {
    sfx.click();
    if (navigator.share) {
      try { await navigator.share({ title: 'Tower Tap', text: shareText() }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    copyText();
  });
  const previewEl = document.getElementById('preview');
  document.getElementById('shuffle').addEventListener('click', () => {
    sfx.click();
    previewEl.style.opacity = '0';
    setTimeout(() => { pickMessage(true); setShareLinks(); previewEl.style.opacity = '1'; }, 150);
  });
  document.getElementById('shCopy').addEventListener('click', () => { sfx.click(); copyText(); });
  ['shWa', 'shTg', 'shSms'].forEach(id => document.getElementById(id).addEventListener('click', () => sfx.click()));

  function drawBlock(x, y, w, h, i, alpha = 1) {
    const hh = hue(i);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `hsl(${hh},70%,62%)`;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = `hsl(${hh},80%,74%)`;
    ctx.fillRect(x, y, w, Math.max(3, h * 0.18));
    ctx.fillStyle = `hsl(${hh},60%,46%)`;
    ctx.fillRect(x, y + h - Math.max(2, h * 0.12), w, Math.max(2, h * 0.12));
    ctx.globalAlpha = 1;
  }

  // menu demo stack
  reset();
  state = 'menu';
  updateScore(false);
  let demoT = 0;

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(2.5, (now - last) / 16.667);
    last = now;

    // move current block
    if (state === 'play' && cur) {
      cur.x += cur.dir * speed * dt;
      const top = stack[stack.length - 1];
      const minX = top.x - top.w * 1.1, maxX = top.x + top.w * 1.1;
      if (cur.x > Math.max(maxX, W - cur.w * 0.4)) { cur.x = Math.max(maxX, W - cur.w * 0.4); cur.dir = -1; }
      if (cur.x < Math.min(minX, -cur.w * 0.6)) { cur.x = Math.min(minX, -cur.w * 0.6); cur.dir = 1; }
    }
    if (state === 'menu') {
      demoT += 0.02 * dt;
      cur.x = (W - cur.w) / 2 + Math.sin(demoT) * W * 0.3;
    }

    cam += (camTarget - cam) * 0.12 * dt;
    zoom += (zoomOut - zoom) * 0.06 * dt;

    // background: sky shifts as you climb
    const h0 = (baseHue + (stack.length * 3)) % 360;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${(h0 + 200) % 360},45%,16%)`);
    g.addColorStop(1, `hsl(${(h0 + 240) % 360},40%,30%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    // zoom around ground center when game ends
    const gy = groundY();
    ctx.translate(W / 2, gy);
    ctx.scale(zoom, zoom);
    ctx.translate(-W / 2, -gy);

    // stack
    const effCam = zoomOut < 1 ? cam * ((zoom - zoomOut) / (1 - zoomOut)) : cam;

    // ground
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(-W * 2, gy + effCam, W * 5, H * 4);
    for (const b of stack) {
      const y = gy - (b.i + 1) * BH + effCam;
      if (y > H / Math.max(zoom, 0.1) + BH || y < -H * 3) continue;
      drawBlock(b.x, y, b.w, BH, b.i);
    }

    // perfect rings
    for (let k = rings.length - 1; k >= 0; k--) {
      const r = rings[k];
      r.t += 0.045 * dt;
      if (r.t >= 1) { rings.splice(k, 1); continue; }
      const pad = r.t * BH * 0.9;
      const y = gy - (r.i + 1) * BH + effCam;
      ctx.strokeStyle = `rgba(255,248,236,${1 - r.t})`;
      ctx.lineWidth = 2;
      ctx.strokeRect(r.x - pad, y - pad, r.w + pad * 2, BH + pad * 2);
    }

    // current block
    if (cur) drawBlock(cur.x, gy - (cur.i + 1) * BH + effCam, cur.w, BH, cur.i);

    // debris (in world coords relative to ground, shifted by cam)
    for (let k = debris.length - 1; k >= 0; k--) {
      const d = debris[k];
      d.vy += 0.5 * dt; d.y += d.vy * dt; d.x += d.vx * dt; d.rot += d.vr * dt;
      const sy = d.y + effCam;
      if (sy > H * 2 / Math.max(zoom, 0.1)) { debris.splice(k, 1); continue; }
      ctx.save();
      ctx.translate(d.x + d.w / 2, sy + BH / 2);
      ctx.rotate(d.rot);
      drawBlock(-d.w / 2, -BH / 2, d.w, BH, d.i, 0.95);
      ctx.restore();
    }
    ctx.restore();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>

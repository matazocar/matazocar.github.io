<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flavor Pairings</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --ink: #2b2622;
    --paper: #faf6f0;
    --card: #ffffff;
    --accent: #a3441f;
    --accent-soft: #e8dcd0;
    --muted: #766c62;
    --border: #e4dbd0;
    --shadow: rgba(43, 38, 34, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 20px 80px;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  h1 {
    font-size: 1.9rem;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }

  header p {
    color: var(--muted);
    margin: 0;
    font-size: 0.95rem;
  }

  .search-box {
    position: relative;
  }

  input[type="text"] {
    width: 100%;
    padding: 16px 20px;
    font-size: 1.1rem;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  .autocomplete-list {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px var(--shadow);
    max-height: 260px;
    overflow-y: auto;
    z-index: 20;
    display: none;
  }

  .autocomplete-list.open { display: block; }

  .ac-item {
    padding: 12px 18px;
    cursor: pointer;
    font-size: 0.98rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .ac-item:last-child { border-bottom: none; }

  .ac-item:hover, .ac-item.active {
    background: var(--accent-soft);
  }

  .ac-item .tag {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .ac-item mark {
    background: none;
    color: var(--accent);
    font-weight: 600;
  }

  .hint {
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
  }

  .no-match {
    margin-top: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .results {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  .result-panel {
    animation: panelIn 0.18s ease;
  }

  @keyframes panelIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-panel.linked {
    padding-top: 18px;
    border-top: 1px dashed var(--border);
  }

  .link-note {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .link-note svg {
    width: 13px;
    height: 13px;
    stroke: var(--muted);
    flex-shrink: 0;
  }

  .result-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 16px;
  }

  .result-header h2 {
    margin: 0;
    font-size: 1.5rem;
    flex: 1;
  }

  .result-header .category-tag {
    font-size: 0.78rem;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 100px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .close-panel-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.3rem;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
    flex-shrink: 0;
  }

  .close-panel-btn:hover {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .pairing-grid {
    display: grid;
    gap: 12px;
  }

  .pairing-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }

  .pairing-card.expandable {
    cursor: pointer;
  }

  .pairing-card.expandable:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .pairing-card.expandable.is-open {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .pairing-card .flavor-name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }

  .pairing-card .flavor-name {
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--ink);
  }

  .pairing-card .expand-icon {
    width: 15px;
    height: 15px;
    stroke: var(--accent);
    flex-shrink: 0;
    opacity: 0.7;
  }

  .pairing-card .flavor-note {
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.45;
  }

  .pairing-card .flavor-note .ex {
    color: var(--accent);
    font-style: normal;
  }

  footer {
    text-align: center;
    margin-top: 50px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.5rem; }
    .pairing-card { padding: 14px; }
  }
</style>
</head>

const allKeys = Object.keys(DB);

function normalize(str) {
  return str.trim().toLowerCase();
}

function findMatches(query) {
  const q = normalize(query);
  if (!q) return [];
  // direct alias resolution takes priority but we still show suggestions from all keys
  const starts = allKeys.filter(k => k.startsWith(q));
  const contains = allKeys.filter(k => !k.startsWith(q) && k.includes(q));
  return [...starts, ...contains].slice(0, 8);
}

function resolveKey(query) {
  const q = normalize(query);
  if (DB[q]) return q;
  if (ALIASES[q]) return ALIASES[q];
  // fuzzy: exact contains match on a single result
  const matches = allKeys.filter(k => k.includes(q));
  if (matches.length === 1) return matches[0];
  return null;
}

const searchInput = document.getElementById('searchInput');
const autocompleteList = document.getElementById('autocompleteList');
const resultsArea = document.getElementById('resultsArea');
const hint = document.getElementById('hint');

let activeIndex = -1;
let currentMatches = [];

function highlightMatch(text, query) {
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + query.length) + '</mark>' + text.slice(idx + query.length);
}

function renderAutocomplete(query) {
  currentMatches = findMatches(query);
  activeIndex = -1;

  if (currentMatches.length === 0) {
    autocompleteList.classList.remove('open');
    autocompleteList.innerHTML = '';
    return;
  }

  autocompleteList.innerHTML = currentMatches.map((key, i) => {
    const item = DB[key];
    return `<div class="ac-item" data-key="${key}" data-idx="${i}">
      <span>${highlightMatch(key, query)}</span>
      <span class="tag">${item.category}</span>
    </div>`;
  }).join('');

  autocompleteList.classList.add('open');

  autocompleteList.querySelectorAll('.ac-item').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.getAttribute('data-key');
      searchInput.value = key;
      autocompleteList.classList.remove('open');
      showResults(key);
    });
  });
}

function updateActiveHighlight() {
  autocompleteList.querySelectorAll('.ac-item').forEach((el, i) => {
    el.classList.toggle('active', i === activeIndex);
  });
}

// panelStack holds the ordered list of DB keys currently displayed.
// panelStack[0] is always the "root" search result; anything after it
// was opened by clicking a pairing card, and remembers which key it was
// opened from (openedFrom) so we can show a small breadcrumb-style note.
let panelStack = []; // [{ key, openedFrom }]

function startNewSearch(key) {
  panelStack = [{ key, openedFrom: null }];
  renderPanelStack();
}

function expandPairing(fromKey, clickedFlavorName) {
  const targetKey = resolveKey(clickedFlavorName);
  if (!targetKey) return; // not expandable, shouldn't happen if UI is correct

  // If this key is already open somewhere in the stack, just scroll to it
  // instead of adding a duplicate panel.
  const existingIndex = panelStack.findIndex(p => p.key === targetKey);
  if (existingIndex !== -1) {
    renderPanelStack(existingIndex);
    return;
  }

  panelStack.push({ key: targetKey, openedFrom: fromKey });
  renderPanelStack(panelStack.length - 1);
}

function closePanel(index) {
  // Closing a panel also closes anything opened from it (and so on),
  // since those child panels no longer have a parent to relate back to.
  const keyBeingClosed = panelStack[index].key;
  panelStack = panelStack.filter((p, i) => {
    if (i < index) return true;
    if (i === index) return false;
    // drop any panel (at any depth) that traces back to the closed one
    return !isDescendantOf(p, keyBeingClosed, index);
  });
  renderPanelStack();
}

function isDescendantOf(panel, ancestorKey, ancestorIndex) {
  // Walk up the openedFrom chain within the current stack to see if
  // this panel eventually traces back to ancestorKey.
  let current = panel;
  const visited = new Set();
  while (current && current.openedFrom) {
    if (visited.has(current.key)) break; // safety against cycles
    visited.add(current.key);
    if (current.openedFrom === ancestorKey) return true;
    current = panelStack.find(p => p.key === current.openedFrom);
  }
  return false;
}

function chevronIconSVG() {
  return `<svg class="expand-icon" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
}

function linkIconSVG() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 1 1 0 10h-2M8 12h8"/></svg>`;
}

function renderPanelStack(scrollToIndex) {
  if (panelStack.length === 0) {
    resultsArea.innerHTML = '';
    return;
  }

  hint.style.display = 'none';

  const panelsHTML = panelStack.map((panelInfo, index) => {
    const { key, openedFrom } = panelInfo;
    const entry = DB[key];

    if (!entry) {
      return `<div class="result-panel"><div class="no-match">No matches found for "${key}".</div></div>`;
    }

    const cardsHTML = entry.pairings.map(p => {
      const targetKey = resolveKey(p.flavor);
      const isExpandable = !!targetKey;
      const isOpen = isExpandable && panelStack.some(pp => pp.key === targetKey);
      const classes = ['pairing-card'];
      if (isExpandable) classes.push('expandable');
      if (isOpen) classes.push('is-open');

      return `
        <div class="${classes.join(' ')}" ${isExpandable ? `data-expand-from="${key}" data-expand-flavor="${p.flavor.replace(/"/g, '&quot;')}"` : ''}>
          <div class="flavor-name-row">
            <div class="flavor-name">${p.flavor}</div>
            ${isExpandable ? chevronIconSVG() : ''}
          </div>
          <div class="flavor-note">${p.note}</div>
        </div>`;
    }).join('');

    const linkNoteHTML = openedFrom
      ? `<div class="link-note">${linkIconSVG()} Paired from ${openedFrom.charAt(0).toUpperCase() + openedFrom.slice(1)}</div>`
      : '';

    return `
      <div class="result-panel ${openedFrom ? 'linked' : ''}" data-panel-index="${index}">
        ${linkNoteHTML}
        <div class="result-header">
          <h2>${key.charAt(0).toUpperCase() + key.slice(1)}</h2>
          <span class="category-tag">${entry.category}</span>
          ${index > 0 ? `<button class="close-panel-btn" data-close-index="${index}" title="Close">&times;</button>` : ''}
        </div>
        <div class="pairing-grid">
          ${cardsHTML}
        </div>
      </div>`;
  }).join('');

  resultsArea.innerHTML = `<div class="results">${panelsHTML}</div>`;

  // Wire up expandable pairing cards
  resultsArea.querySelectorAll('.pairing-card.expandable').forEach(card => {
    card.addEventListener('click', () => {
      const fromKey = card.getAttribute('data-expand-from');
      const flavorName = card.getAttribute('data-expand-flavor');
      expandPairing(fromKey, flavorName);
    });
  });

  // Wire up close buttons
  resultsArea.querySelectorAll('.close-panel-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.getAttribute('data-close-index'), 10);
      closePanel(idx);
    });
  });

  if (typeof scrollToIndex === 'number') {
    requestAnimationFrame(() => {
      const el = resultsArea.querySelector(`[data-panel-index="${scrollToIndex}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  }
}

// Kept for compatibility with the search/autocomplete code below —
// starting a fresh search always resets the panel stack.
function showResults(key) {
  if (!key) {
    resultsArea.innerHTML = `<div class="no-match">No matches found for "${searchInput.value}". Try a different ingredient, or check the spelling.</div>`;
    hint.style.display = 'none';
    return;
  }
  startNewSearch(key);
}

searchInput.addEventListener('input', (e) => {
  const val = e.target.value;
  if (!val.trim()) {
    resultsArea.innerHTML = '';
    autocompleteList.classList.remove('open');
    hint.style.display = 'block';
    return;
  }
  renderAutocomplete(val);

  // If it's an exact/alias match, show results live too
  const key = resolveKey(val);
  if (key) {
    showResults(key);
  } else {
    resultsArea.innerHTML = '';
  }
});

searchInput.addEventListener('keydown', (e) => {
  if (!autocompleteList.classList.contains('open')) {
    if (e.key === 'Enter') {
      const key = resolveKey(searchInput.value);
      showResults(key);
    }
    return;
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeIndex = Math.min(activeIndex + 1, currentMatches.length - 1);
    updateActiveHighlight();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeIndex = Math.max(activeIndex - 1, 0);
    updateActiveHighlight();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeIndex >= 0 && currentMatches[activeIndex]) {
      const key = currentMatches[activeIndex];
      searchInput.value = key;
      autocompleteList.classList.remove('open');
      showResults(key);
    } else {
      const key = resolveKey(searchInput.value);
      autocompleteList.classList.remove('open');
      showResults(key);
    }
  } else if (e.key === 'Escape') {
    autocompleteList.classList.remove('open');
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-box')) {
    autocompleteList.classList.remove('open');
  }
});
</script>

</body>
</html>
